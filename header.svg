<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Dhanusu E, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <!-- animated waves -->
    <g opacity="0.35" fill="url(#ac)">
      <path d="M0 200 Q 112 160 225 200 T 450 200 T 675 200 T 900 200 T 1125 200 T 1350 200 V260 H0Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.2" fill="url(#ac)">
      <path d="M0 215 Q 112 185 225 215 T 450 215 T 675 215 T 900 215 T 1125 215 T 1350 215 V260 H0Z">
        <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- floating particles -->
    <g fill="#e0e7ff">
      <circle cx="80" cy="60" r="2.5" opacity=".6"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="2" opacity=".5"><animate attributeName="cy" values="30;55;30" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="50" r="3" opacity=".5"><animate attributeName="cy" values="50;30;50" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="110" r="2" opacity=".6"><animate attributeName="cy" values="110;90;110" dur="8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- code brackets -->
    <text x="60" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="64" fill="#38bdf8" opacity=".5">&lt;/&gt;</text>
    <!-- name -->
    <text x="450" y="105" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff">
      Dhanusu E
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="360" y="120" width="180" height="4" rx="2" fill="url(#ac)">
      <animate attributeName="width" values="0;180" dur="1.2s" fill="freeze"/>
      <animate attributeName="x" values="450;360" dur="1.2s" fill="freeze"/>
    </rect>
    <!-- rotating roles -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#c7d2fe" text-anchor="middle">
      <text x="450" y="165" opacity="0">Full Stack Developer (MERN)
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
      <text x="450" y="165" opacity="0">React · Node.js · Express · MongoDB
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text x="450" y="165" opacity="0">Secure REST APIs with JWT
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
      <text x="450" y="165" opacity="0">Open to entry-level developer roles
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
    </g>
    <!-- blinking cursor -->
    <rect x="640" y="146" width="3" height="24" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
